services:
  - type: web
    name: fuelcap-app
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NEXT_PUBLIC_APP_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: FUEL_FINDER_CLIENT_ID
        sync: false
      - key: FUEL_FINDER_CLIENT_SECRET
        sync: false
      - key: FUEL_FINDER_TOKEN_URL
        sync: false
      - key: FUEL_FINDER_API_BASE_URL
        value: https://www.fuel-finder.service.gov.uk
      - key: FUEL_FINDER_PRICES_PATH
        value: /api/v1/pfs/fuel-prices
      - key: FUEL_FINDER_FORECOURTS_PATH
        value: /api/v1/pfs
      - key: FUEL_FINDER_MAX_BATCHES
        value: 40
      - key: FUEL_FINDER_DISPLAY_LIMIT
        value: 500
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: PRICING_INGESTION_SECRET
        sync: false
      - key: FUEL_FINDER_SCOPE
        value: fuelfinder.read
      - key: FUEL_FINDER_FUEL_TYPE
        value: E10
